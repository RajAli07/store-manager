<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Store Manager{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <aside class="sidebar">
        <div class="brand">Store Manager</div>
        <nav>
            <a href="/" class="{{ 'on' if active == 'dashboard' }}">Dashboard</a>
            <a href="/products" class="{{ 'on' if active == 'products' }}">Products</a>
            <a href="/orders" class="{{ 'on' if active == 'orders' }}">Orders</a>
            <a href="/contacts" class="{{ 'on' if active == 'contacts' }}">Contacts</a>
        </nav>
    </aside>

    <main class="content">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>

</html>
